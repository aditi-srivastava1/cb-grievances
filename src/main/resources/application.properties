# ---------- Database (values come from the environment, never from this file) ----------
spring.datasource.url=jdbc:mysql://localhost:3306/cb_grievances_db
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ---------- Photo uploads ----------
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# ---------- Email ----------
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

app.mail.from=${MAIL_USERNAME:}
app.mail.override-to=${MAIL_TEST_RECIPIENT:}

# ---------- First warden account (created on startup if it doesn't exist) ----------
app.warden.email=${WARDEN_EMAIL:}
app.warden.password=${WARDEN_PASSWORD:}
app.warden.name=${WARDEN_NAME:Warden}

# ---------- Privacy: don't show internal details to users ----------
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.include-exception=false

# ---------- Session cookie safety ----------
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax