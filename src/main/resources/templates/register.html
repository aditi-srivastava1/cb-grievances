<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Register')}"></head>
<body>
<div class="auth-bg d-flex align-items-center py-4">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-10 col-xl-9">
                <div class="card auth-card">
                    <div class="row g-0">

                        <div class="col-md-5 auth-hero p-4 p-lg-5 d-flex flex-column justify-content-center">
                            <div class="fs-1 mb-2"><i class="bi bi-building"></i></div>
                            <h2 class="fw-bold">CB Grievances</h2>
                            <p class="opacity-75 mb-1">Chandrabhaga Hostel Complaint System</p>
                            <p class="fw-semibold mb-4">Hey Resident! Create account to file your complaint</p>
                            <ul class="list-unstyled small mb-0">
                                <li><i class="bi bi-camera me-2"></i>Report issues, with photos</li>
                                <li><i class="bi bi-activity me-2"></i>Track every status update</li>
                                <li><i class="bi bi-bell me-2"></i>Get notified when it's resolved</li>
                            </ul>
                        </div>

                        <div class="col-md-7 p-4 p-lg-5">
                            <h4 class="fw-bold mb-1">Create your account</h4>
                            <p class="text-muted mb-4">Resident registration</p>

                            <div th:if="${error != null}" class="alert alert-danger py-2" th:text="${error}"></div>

                            <form th:action="@{/register}" th:object="${resident}" method="post">
                                <div class="mb-3">
                                    <label class="form-label">JNU Email ID</label>
                                    <input type="email" th:field="*{jnuId}" class="form-control"
                                           placeholder="yourname@jnu.ac.in" maxlength="100"
                                           autocomplete="off" required/>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Name</label>
                                    <input type="text" th:field="*{name}" class="form-control"
                                           maxlength="100" required/>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label">Password
                                        <span class="text-muted fw-normal">(at least 8 characters)</span></label>
                                    <div class="input-group">
                                        <input type="password" th:field="*{password}" id="passwordInput"
                                               class="form-control" minlength="8" maxlength="72"
                                               autocomplete="new-password" required/>
                                        <button type="button" id="togglePassword" class="btn btn-outline-secondary"
                                                aria-label="Show or hide password">
                                            <i class="bi bi-eye" id="toggleIcon"></i>
                                        </button>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-6 mb-3">
                                        <label class="form-label">Wing</label>
                                        <select th:field="*{wing}" class="form-select">
                                            <option value="Boys">Boys Wing</option>
                                            <option value="Girls">Girls Wing</option>
                                        </select>
                                    </div>
                                    <div class="col-6 mb-3">
                                        <label class="form-label">Room Number</label>
                                        <input type="text" th:field="*{roomNumber}" class="form-control"
                                               maxlength="10" required/>
                                    </div>
                                </div>

                                <button type="submit" class="btn btn-primary w-100 py-2 mt-2">Create account</button>
                            </form>

                            <p class="text-center text-muted mt-4 mb-0">
                                Already registered? <a th:href="@{/login}">Login</a>
                            </p>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const passwordInput = document.getElementById('passwordInput');
    const toggleIcon = document.getElementById('toggleIcon');
    document.getElementById('togglePassword').addEventListener('click', function () {
        const hidden = passwordInput.type === 'password';
        passwordInput.type = hidden ? 'text' : 'password';
        toggleIcon.className = hidden ? 'bi bi-eye-slash' : 'bi bi-eye';
    });
</script>
</body>
</html>
